# Publishes the static verifier to GitHub Pages and keeps chains.js current.
name: Deploy verifier to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every six hours, on the hour (UTC). A new commitment is picked up within six hours.
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CRASHTOP_BASE: https://crashtop.com

jobs:
  build:
    name: Refresh, test and assemble the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh the public chain list
        id: refresh
        run: |
          set -euo pipefail

          code=$(curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 --retry 2 --retry-delay 3 \
            -H 'accept: application/json' "$CRASHTOP_BASE/api/fair/chain" 2>/dev/null | tail -n 1 || true)
          code=${code:-000}
          echo "GET $CRASHTOP_BASE/api/fair/chain -> $code"

          if [ "$code" = "403" ]; then
            echo "::warning::crashtop.com answered 403 (pre-launch/WAF lock); skipping the refresh and publishing the committed chains.js"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            echo "status=waf-403" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::crashtop.com answered HTTP $code for /api/fair/chain"
            exit 1
          fi

          if ! output=$(node tools/export.mjs --base "$CRASHTOP_BASE" 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -q 'HTTP 403'; then
              echo "::warning::the export hit a 403 mid-run; keeping the committed chains.js"
              echo "refreshed=false" >> "$GITHUB_OUTPUT"
              echo "status=waf-403" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"

          if git diff --quiet -- chains.js; then
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            echo "status=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            echo "status=changed" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- chains.js
          fi

      - name: Refuse to publish a seed
        run: node tools/check-public.mjs

      - name: Test the verifier math
        run: node --test

      - name: Commit the refreshed chain list
        if: steps.refresh.outputs.refreshed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chains.js
          git commit -m 'chore(chains): refresh the public chain commitments'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed the refreshed chains.js"
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          echo "::error::the refreshed chains.js could not be pushed"
          exit 1

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for file in index.html styles.css app.js verify.js worker.js chains.js; do
            test -f "$file" || { echo "missing $file" >&2; exit 1; }
            cp "$file" _site/
          done
          : > _site/.nojekyll
          echo "Site contents:" && ls -la _site

      - name: Read the Pages base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Record the deployed origin
        run: |
          {
            echo "Chain list: ${{ steps.refresh.outputs.status }}"
            echo "Verifier URL: ${{ steps.pages.outputs.base_url }}/"
            echo "Game setting: FAIR_VERIFIER_URL=${{ steps.pages.outputs.base_url }}"
            echo "Verify locally first: node tools/check-public.mjs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
